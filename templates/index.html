
<!DOCTYPE html>
<html>
<head>
  <title>Instagram Reel Downloader</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="card">
    <h1>Instagram Reel Downloader</h1>
    <form method="POST">
      <input type="text" name="url" placeholder="Paste Instagram Reel URL" required>
      <button type="submit">Download Reel</button>
    </form>
    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}
    <p class="note">✔ Works only for public reels</p>
  </div>
</body>
</html>
